<!DOCTYPE html>
<html lang="en" id="html-tag">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="google-site-verification" content="amEV_R1n8HIoVOAtzN3bf86UkAL7uOUticAs9jLDzbU" />
        <title>Password Generator</title>
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'%3E%3Cpath d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z'/%3E%3C/svg%3E">
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
        <link rel="stylesheet" href="./src/css/style.css">
    </head>
    <body class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
        <div class="fixed top-6 right-6">
            <button id="theme-toggle" aria-label="Cambia tema visivo" class="p-3 bg-white dark:bg-slate-800 shadow-lg rounded-2xl border border-slate-200 dark:border-slate-700 hover:scale-110 transition-transform">
                <span id="theme-icon" class="material-icons-round text-amber-500 dark:text-indigo-400">dark_mode</span>
            </button>
        </div>
        <div class="material-card w-full max-w-md p-10 bg-white dark:bg-slate-900 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl">
            <header class="mb-10 text-center">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-500/10 rounded-2xl mb-4 text-indigo-600 dark:text-indigo-400">
                    <span class="material-icons-round text-3xl">verified_user</span>
                </div>
                <h1 class="text-2xl font-black tracking-tight">Password Generator</h1>
            </header>
            <div class="relative mb-6 group">
                <input type="text" id="password-display" readonly 
                    class="w-full bg-slate-100 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-2xl py-6 pl-6 pr-24 font-mono text-indigo-600 dark:text-indigo-300 transition-all focus:ring-2 ring-indigo-500/20 outline-none" placeholder="---">
                <div class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center bg-white dark:bg-slate-800 rounded-xl p-1 border border-slate-200 dark:border-slate-700 shadow-sm">
                    <button id="refresh-btn" aria-label="Rigenera password" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors group">
                        <span class="material-icons-round text-slate-400 group-hover:text-indigo-500 dark:group-hover:text-indigo-400 text-xl">refresh</span>
                    </button>
                    <button id="copy-btn" aria-label="Copia password negli appunti" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors group">
                        <span id="copy-icon" class="material-icons-round text-slate-400 group-hover:text-emerald-500 text-xl">content_copy</span>
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between mb-8 px-2 text-sm">
                <span class="text-slate-400 font-medium">Strength (Entropy):</span>
                <span id="entropy-val" class="font-mono font-bold text-red-500">0 bit</span>
            </div>
            <div class="space-y-8">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label for="length" class="text-xs font-bold uppercase text-slate-400 tracking-wider">Length</label>
                        <span id="length-val" class="text-indigo-600 dark:text-indigo-400 font-mono font-bold text-lg">16</span>
                    </div>
                    <input type="range" id="length" min="8" max="64" value="16" 
                        aria-valuemin="8" aria-valuemax="64" aria-valuenow="16"
                        class="w-full h-2 rounded-lg appearance-none cursor-pointer bg-slate-200 dark:bg-slate-800 accent-indigo-600">
                </div>
                <div class="grid grid-cols-1 gap-3">
                    <label class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/40 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-2xl cursor-pointer transition-all border border-transparent hover:border-indigo-100 dark:hover:border-slate-700">
                        <span class="text-sm font-semibold">Uppercase</span>
                        <input type="checkbox" id="uppercase" checked aria-checked="true" class="w-5 h-5 rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500">
                    </label>
                    <label class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/40 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-2xl cursor-pointer transition-all border border-transparent hover:border-indigo-100 dark:hover:border-slate-700">
                        <span class="text-sm font-semibold">Numbers</span>
                        <input type="checkbox" id="numbers" checked aria-checked="true" class="w-5 h-5 rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500">
                    </label>
                    <label class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/40 hover:bg-indigo-50 dark:hover:bg-slate-800 rounded-2xl cursor-pointer transition-all border border-transparent hover:border-indigo-100 dark:hover:border-slate-700">
                        <span class="text-sm font-semibold">Symbols</span>
                        <input type="checkbox" id="symbols" checked aria-checked="true" class="w-5 h-5 rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500">
                    </label>
                </div>
            </div>
        </div>
        <script type="module" src="./src/js/app.js"></script>
        <script data-goatcounter="https://viduxsh.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    </body>
</html>
